<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBFCFA" />
<title>ClimbKit</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--stone:#DDE2DE;--chalk:#FBFCFA;--panel:#F1F3EF;--white:#fff;--ink:#131715;--ink-2:#6C736E;--ink-3:#9AA09B;--line:#E3E7E2;--line-2:#CFD5CF;--petrol:#0E6B57;--petrol-bg:#E3EEE9;--clay:#B23A2E;--clay-bg:#F6E5E2;--ochre:#8A6212;--ochre-bg:#F5EBD8;--rope:#A8481C;--rope-bg:#F6E8E0;--slate:#3C4A54;--slate-bg:#E8ECEE;--ice:#2C5A78;--ice-bg:#E6EDF2}
[data-theme=dark]{--stone:#090C0B;--chalk:#141917;--panel:#1C2220;--white:#1F2725;--ink:#E9EDE9;--ink-2:#9AA39D;--ink-3:#6D7772;--line:#242C29;--line-2:#39423E;--petrol:#5FC0A0;--petrol-bg:#15302A;--clay:#E28275;--clay-bg:#3B221F;--ochre:#D9AF5C;--ochre-bg:#342A17;--rope:#DC8F63;--rope-bg:#3B261A;--slate:#A3B7C4;--slate-bg:#1F2B32;--ice:#83B7D8;--ice-bg:#18272F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--stone);font-family:'Archivo',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
#phone{width:100%;max-width:400px;height:100dvh;max-height:880px;background:var(--chalk);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:520px){#phone{border-radius:28px;height:860px}}
#view{flex:1;overflow-y:auto;overscroll-behavior:contain}
#view.full{display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 18px 12px}
.acts{display:flex;gap:14px}
.sp{width:21px;flex:none}
.icobtn{background:none;border:none;padding:0;color:var(--ink-2);cursor:pointer;display:flex;font-family:inherit}
.icobtn.on{color:var(--ink)}
.icobtn.txt{font-size:13px}
.icobtn svg,.check{width:21px;height:21px}
.title{font-size:19px;font-weight:600;letter-spacing:-.3px;margin:0}
.title.sm{font-size:15px;font-weight:500}
.body{padding:0 18px 24px}
.meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3);margin:3px 0 0;display:block}
.meta.mb{margin-bottom:16px}
.label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-3);letter-spacing:.6px;margin:18px 0 9px}
.label.first{margin-top:0}
.name{font-size:14.5px;font-weight:500;margin:0;letter-spacing:-.1px;display:block}
.lead{font-size:13.5px;margin:0}
.sub{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin:6px 0 14px}
.sub.center{text-align:center;margin-top:26px}
.mt{font-size:17px;font-weight:600;letter-spacing:-.3px;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:7px 13px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-2);background:none;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--chalk)}
.chip.lite{background:var(--panel);border-color:transparent;color:var(--ink)}
.chip svg{width:13px;height:13px}
.note{border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:none;font-family:inherit;cursor:pointer}
.note.nb{margin-bottom:14px;cursor:default}
.note p{margin:0;font-size:12.5px;line-height:1.45}
.note .s{font-size:11px;margin-top:4px;opacity:.85}
.note svg{width:17px;height:17px;flex:none;margin-top:1px}
.note.alert{background:var(--clay-bg);color:var(--clay)}
.note.warn{background:var(--ochre-bg);color:var(--ochre)}
.note.info{background:var(--slate-bg);color:var(--slate)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border:none;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;font-family:inherit;color:inherit}
.item:last-child{border-bottom:none}
.item:active{opacity:.55}
.item.static{cursor:default}
.item[disabled]{opacity:.6}
.badge{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.badge.plain{background:var(--panel);color:var(--ink)}
.badge svg{width:21px;height:21px}
.grow{flex:1;min-width:0}
.chev{color:var(--line-2);display:flex}
.tick{display:flex;flex:none}
.pill{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:4px 9px;border-radius:20px;white-space:nowrap}
.pill.alert{background:var(--clay-bg);color:var(--clay)}
.pill.warn{background:var(--ochre-bg);color:var(--ochre)}
.pill.ok{background:var(--petrol-bg);color:var(--petrol)}
.pill.mute{background:var(--panel);color:var(--ink-3)}
.pw{display:inline-block;margin-top:7px}
.dim .name,.dim .meta{color:var(--ink-3)}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.hname{font-size:15.5px;font-weight:500;margin:0}
.card{background:var(--white);border-radius:16px;padding:14px 15px}
.card.tight{padding:2px 15px}
.ring-card{display:flex;align-items:center;gap:15px;margin-bottom:12px}
.gauge+.gauge{margin-top:14px}
.grow-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}
.grow-row.gap{margin-top:8px}
.grow-row .n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-2)}
.track{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:9px}
.track span{display:block;height:100%;border-radius:4px;background:var(--petrol);transition:width .4s}
.track span.w{background:var(--ochre)}.track span.a{background:var(--clay)}
.slegend{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3);margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats .card{padding:11px 12px}
.stats .k{font-size:10.5px;color:var(--ink-3);margin:0}
.stats .v{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:500;margin:4px 0 0}
.log{display:flex;gap:12px;padding:9px 0;align-items:flex-start}
.log .dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none;background:var(--line-2)}
.log .dot.a{background:var(--clay)}.log .dot.o{background:var(--petrol)}.log .dot.i{background:var(--slate)}
.log p{margin:0}.log .t{font-size:13px}
.btn{width:100%;padding:13px;font-size:14px;font-family:inherit;font-weight:500;border-radius:14px;border:none;background:var(--ink);color:var(--chalk);cursor:pointer}
.btn:active{opacity:.8}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line-2);font-weight:400}
.btn.danger{background:var(--clay);color:#fff}
.btn.dangerghost{background:none;color:var(--clay);border:1px solid var(--clay-bg);font-weight:400}
.brow{display:flex;gap:8px;margin-top:18px}
.brow .btn{padding:11px 0;font-size:13px}
.row2{display:flex;gap:9px;margin-top:18px}
.foot{padding:12px 18px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--chalk)}
nav{display:flex;padding:8px 0 max(12px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:none;font-family:inherit;font-size:9.5px;color:var(--ink-3);cursor:pointer;padding:0}
nav button.on{color:var(--ink)}
nav svg{width:21px;height:21px;display:block}
.navico{position:relative;display:inline-block;margin-bottom:4px}
.navdot{position:absolute;top:-5px;right:-9px;min-width:15px;height:15px;border-radius:8px;background:var(--clay);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:9px;line-height:15px;text-align:center;padding:0 3px;font-style:normal}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid transparent;border-radius:12px;padding:11px 13px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--line-2);background:var(--white)}
textarea{resize:none;line-height:1.5}
select.mini{width:auto;padding:7px 9px;font-size:12.5px;background:var(--panel)}
input.file{padding:11px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.field .req{color:var(--clay)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:40px 20px 24px}
.empty h2{font-size:17px;font-weight:500;margin:20px 0 0}
.empty p{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:10px 0 0}
.logobtn{background:none;border:none;padding:0;cursor:pointer;color:inherit;display:block;margin:0 auto;transition:transform .15s}
.logobtn:active{transform:scale(.94)}
.logo-ghost{width:92px;height:92px;color:var(--line-2)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery button{aspect-ratio:1;border-radius:13px;border:none;padding:0;cursor:pointer;background-size:cover;background-position:center;background-color:var(--panel)}
.gallery label{aspect-ratio:1;border-radius:13px;border:1px dashed var(--line-2);color:var(--ink-3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.gallery label svg{width:20px;height:20px}
.gallery label input{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);display:flex;z-index:20;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.scrim.center{align-items:center;justify-content:center;padding:18px}
.scrim.bottom{align-items:flex-end}
.dlg{background:var(--chalk);border-radius:20px;padding:20px;width:100%}
.dlg.pad{padding:14px}
.full{width:100%;border-radius:14px;display:block}
.sheet{background:var(--chalk);border-radius:22px 22px 0 0;padding:14px 18px max(20px,env(safe-area-inset-bottom));width:100%;max-height:82%;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px)}}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 16px}
.toggle{width:38px;height:22px;border-radius:12px;background:var(--petrol);position:relative;flex:none;cursor:pointer}
.toggle i{position:absolute;top:2px;left:18px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .18s}
.toggle.off{background:var(--line-2)}.toggle.off i{left:2px}
.ring{width:52px;height:52px;flex:none}
.ring .rbg{stroke:var(--line)}
.hint{font-size:11.5px;color:var(--ink-3);text-align:center;margin:16px 0 0;line-height:1.5}
.counter{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3);text-align:right;margin:5px 0 0}
.obwrap{flex:1;display:flex;flex-direction:column;padding:0 26px 4px}
.ob-nav{display:flex;align-items:center;justify-content:space-between;padding-top:16px}
.ob-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ob-art svg{width:88px;height:88px;color:var(--ink)}
.ob-art.big svg{width:104px;height:104px}
.ob-mid h2{font-size:22px;font-weight:600;letter-spacing:-.4px;margin:22px 0 0}
.ob-mid h2.brand{font-size:40px;letter-spacing:-1.5px;margin-top:20px;line-height:1}
.ob-bot p{font-size:14px;color:var(--ink-2);line-height:1.62;margin:0;text-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin:22px 0 4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--ink);width:18px;border-radius:3px}
.skiprow{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;flex:none}
.box.on{background:var(--ink);border-color:var(--ink);color:var(--chalk)}
.box svg{width:12px;height:12px}
.toast{position:absolute;left:18px;right:18px;bottom:86px;background:var(--ink);color:var(--chalk);border-radius:14px;padding:12px 15px;font-size:13px;z-index:40;animation:up .2s ease}
</style>
</head>
